<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login • Prediction-v</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0c10;
            color: #fff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            margin: 20px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 30% 30%, #fbb8d4, #ec4899);
            border-radius: 50%;
            position: relative;
            margin: 0 auto 12px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
            border: 2px solid rgba(255,255,255,0.15);
        }

        .logo-icon::after {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            background: #0a0c10;
            border-radius: 50%;
            top: 8px;
            right: 8px;
            box-shadow: inset -2px 2px 6px rgba(0,0,0,0.5);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbb8d4, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-tagline {
            font-size: 0.8rem;
            color: #8e8e9a;
            margin-top: 4px;
        }

        /* Card */
        .card {
            background: #12141c;
            border-radius: 28px;
            padding: 28px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Toggle */
        .toggle-container {
            display: flex;
            gap: 8px;
            background: #1a1c26;
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 36px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #8e8e9a;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 2px 8px rgba(245, 87, 108, 0.3);
        }

        /* Forms */
        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #8e8e9a;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            background: #1a1c26;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #f5576c;
            background: #1f212e;
        }

        input::placeholder {
            color: #4a4a5a;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            padding: 14px;
            border-radius: 28px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 8px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Forgot password link */
        .forgot-password {
            text-align: right;
            margin-top: 12px;
        }

        .forgot-password a {
            color: #f5576c;
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .forgot-password a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Divider - completely removed from login area, but kept as hidden if needed */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #4a4a5a;
            font-size: 0.75rem;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        /* Demo notice - removed as requested (below login button) */
        /* The extra information is removed */

        /* Message */
        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            display: block;
        }

        /* Loading spinner inline */
        .spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer links - kept simple without removed content */
        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: #4a4a5a;
        }

        .footer-links a {
            color: #8e8e9a;
            text-decoration: none;
        }

        /* Password hint for signup */
        .password-hint {
            font-size: 0.65rem;
            color: #6b6b7a;
            margin-top: 6px;
        }

        /* Reset modal for forgot password (sleek minimal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #12141c;
            border-radius: 28px;
            padding: 28px 24px;
            width: 90%;
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }

        .modal-card h3 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fbb8d4, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .modal-card p {
            color: #8e8e9a;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .modal-close {
            background: #1a1c26;
            border: none;
            color: #fff;
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            background: #2a2c3a;
        }

        .reset-btn {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">Prediction-v</div>
            <div class="logo-tagline">Verified Predictions • Pay Only After Winning</div>
        </div>

        <div class="card">
            <div class="toggle-container">
                <div class="toggle-btn active" data-mode="login">Login</div>
                <div class="toggle-btn" data-mode="signup">Sign Up</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Login →</button>
                <!-- Forgot Password link added below login button -->
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Forgot password?</a>
                </div>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required autocomplete="new-password">
                    <div class="password-hint">Password must be at least 6 characters</div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="••••••••" required autocomplete="off">
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">Create Account →</button>
            </form>

            <div id="message" class="message"></div>

            <!-- REMOVED: Divider and demo-notice section originally below login button -->
            <!-- The extra information (Why Prediction-v? + demo notice) has been completely removed -->
        </div>

        <div class="footer-links">
            <a href="#">Terms</a> • <a href="#">Privacy</a> • <a href="#">Support</a>
        </div>
    </div>

    <!-- Forgot Password Modal (minimal) -->
    <div id="resetModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Reset password</h3>
            <p>Enter your email address and SUPABASE will send you a password reset link.</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="resetEmail" placeholder="you@example.com">
            </div>
            <button id="sendResetBtn" class="btn-primary reset-btn">Send reset link</button>
            <button id="closeModalBtn" class="modal-close">Cancel</button>
            <div id="resetMessage" style="margin-top: 12px; font-size: 0.75rem; text-align: center; color: #10b981;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wmqsephiktkndrzasdam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcXNlcGhpa3RrbmRyemFzZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzk2NDEsImV4cCI6MjA5MjY1NTY0MX0.cpun979RKcODBePmVFij02PPcLwiSTRESrzPkiuTB5I';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentMode = 'login';

        // Get redirect URL from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || 'index.html';

        // Check if user is already logged in
        async function checkSession() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                window.location.href = redirectUrl;
            }
        }

        // Toggle between login and signup
        function setupToggles() {
            const toggles = document.querySelectorAll('.toggle-btn');
            toggles.forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const mode = toggle.dataset.mode;
                    currentMode = mode;
                    
                    // Update active class
                    toggles.forEach(t => t.classList.remove('active'));
                    toggle.classList.add('active');
                    
                    // Show/hide forms
                    document.getElementById('loginForm').classList.remove('active');
                    document.getElementById('signupForm').classList.remove('active');
                    
                    if (mode === 'login') {
                        document.getElementById('loginForm').classList.add('active');
                    } else {
                        document.getElementById('signupForm').classList.add('active');
                    }
                    
                    // Clear messages
                    hideMessage();
                });
            });
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }
            
            setButtonLoading(btn, true);
            hideMessage();
            
            const { data, error } = await sb.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            setButtonLoading(btn, false);
            
            if (error) {
                if (error.message.includes('Invalid login')) {
                    showMessage('Invalid email or password', 'error');
                } else {
                    showMessage(error.message, 'error');
                }
                return;
            }
            
            if (data.user) {
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const btn = document.getElementById('signupBtn');
            
            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            setButtonLoading(btn, true);
            hideMessage();
            
            const { data, error } = await sb.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        email: email
                    }
                }
            });
            
            setButtonLoading(btn, false);
            
            if (error) {
                if (error.message.includes('already registered')) {
                    showMessage('Email already registered. Please login instead.', 'error');
                    // Switch to login mode
                    document.querySelector('.toggle-btn[data-mode="login"]').click();
                    document.getElementById('loginEmail').value = email;
                } else {
                    showMessage(error.message, 'error');
                }
                return;
            }
            
            if (data.user) {
                // Check if email confirmation is required
                if (data.user.identities && data.user.identities.length === 0) {
                    showMessage('User already exists. Please login.', 'error');
                    document.querySelector('.toggle-btn[data-mode="login"]').click();
                    document.getElementById('loginEmail').value = email;
                } else if (data.user.confirmed_at) {
                    // Email confirmed (auto-confirm in Supabase settings)
                    showMessage('Account created! Redirecting...', 'success');
                    
                    // Create profile entry automatically
                    await createProfileEntry(data.user.id, email);
                    
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1500);
                } else {
                    // Email confirmation required
                    showMessage('Account created! Check your email to confirm your account.', 'success');
                    // Clear password fields
                    document.getElementById('signupPassword').value = '';
                    document.getElementById('signupConfirmPassword').value = '';
                }
            }
        }
        
        async function createProfileEntry(userId, email) {
            // Extract username from email (before @)
            const username = email.split('@')[0];
            
            // Check if profile already exists
            const { data: existing } = await sb
                .from('profiles')
                .select('id')
                .eq('id', userId)
                .maybeSingle();
            
            if (!existing) {
                await sb
                    .from('profiles')
                    .insert({
                        id: userId,
                        username: username,
                        display_name: username,
                        email: email
                    });
            }
        }

        // Forgot password logic using Supabase reset password for email
        function setupForgotPassword() {
            const forgotLink = document.getElementById('forgotPasswordLink');
            const modal = document.getElementById('resetModal');
            const closeBtn = document.getElementById('closeModalBtn');
            const sendResetBtn = document.getElementById('sendResetBtn');
            const resetEmailInput = document.getElementById('resetEmail');
            const resetMsgDiv = document.getElementById('resetMessage');
            
            // Open modal
            forgotLink.addEventListener('click', (e) => {
                e.preventDefault();
                // Prefill email from login form if available
                const loginEmail = document.getElementById('loginEmail').value.trim();
                if (loginEmail) {
                    resetEmailInput.value = loginEmail;
                } else {
                    resetEmailInput.value = '';
                }
                resetMsgDiv.innerHTML = '';
                modal.style.display = 'flex';
            });
            
            // Close modal
            function closeModal() {
                modal.style.display = 'none';
                resetMsgDiv.innerHTML = '';
            }
            
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            
            // Send reset email
            sendResetBtn.addEventListener('click', async () => {
                const email = resetEmailInput.value.trim();
                if (!email) {
                    resetMsgDiv.style.color = '#ef4444';
                    resetMsgDiv.innerHTML = 'Please enter your email address.';
                    return;
                }
                
                // Disable button temporarily
                sendResetBtn.disabled = true;
                sendResetBtn.innerHTML = '<span class="spinner-sm"></span>Sending...';
                resetMsgDiv.style.color = '#8e8e9a';
                resetMsgDiv.innerHTML = '';
                
                // Using Supabase reset password for email (password recovery)
                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'reset-password.html') || `${window.location.origin}/reset-password.html`,
                });
                
                sendResetBtn.disabled = false;
                sendResetBtn.innerHTML = 'Send reset link';
                
                if (error) {
                    resetMsgDiv.style.color = '#ef4444';
                    resetMsgDiv.innerHTML = error.message;
                } else {
                    resetMsgDiv.style.color = '#10b981';
                    resetMsgDiv.innerHTML = '✓ Reset link sent! Check your email.';
                    // Optionally clear after 3 seconds and close
                    setTimeout(() => {
                        closeModal();
                    }, 3000);
                }
            });
        }

        function setButtonLoading(btn, isLoading) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-sm"></span>Please wait...';
            } else {
                btn.disabled = false;
                if (currentMode === 'login') {
                    btn.innerHTML = 'Login →';
                } else {
                    btn.innerHTML = 'Create Account →';
                }
            }
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
        }

        function hideMessage() {
            const msgDiv = document.getElementById('message');
            msgDiv.className = 'message';
            msgDiv.textContent = '';
        }

        // Enter key submission
        function setupEnterKey() {
            document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin(e);
            });
            document.getElementById('signupConfirmPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSignup(e);
            });
        }

        // Initialize all
        checkSession();
        setupToggles();
        setupEnterKey();
        setupForgotPassword();   // Forgot password handler with modal
    </script>
</body>
</html>
