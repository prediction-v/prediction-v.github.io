<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard • Ranka Tipster</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0c10;
            color: #fff;
            line-height: 1.5;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .profile-icon {
            background: none;
            border: none;
            color: #8e8e9a;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg, #1a1c26, #12141c);
            margin: 16px;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(245, 87, 108, 0.2);
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .welcome-sub {
            font-size: 0.8rem;
            color: #8e8e9a;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #12141c;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f5576c;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #8e8e9a;
            margin-top: 4px;
        }

        /* Section Title */
        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0 16px;
            margin-bottom: 12px;
            color: #8e8e9a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Content Cards */
        .content-list {
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .content-card {
            background: #12141c;
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-content {
            padding: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #fff;
            flex: 1;
        }

        .card-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .badge-post { background: rgba(30, 158, 255, 0.2); color: #1e9eff; }
        .badge-prediction { background: rgba(245, 87, 108, 0.2); color: #f5576c; }
        .badge-story { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }

        .card-preview {
            font-size: 0.8rem;
            color: #8e8e9a;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-image {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 8px;
        }

        .card-meta {
            font-size: 0.65rem;
            color: #6b6b7a;
            margin-bottom: 10px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .card-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card-btn.edit {
            background: rgba(30, 158, 255, 0.2);
            color: #1e9eff;
        }

        .card-btn.delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .card-btn.view {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #6b6b7a;
            background: #12141c;
            border-radius: 16px;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .modal-content {
            background: #12141c;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal input, .modal textarea {
            width: 100%;
            background: #1a1c26;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .modal textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 28px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.save {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .modal-btn.cancel {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .modal-btn.delete-confirm {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 8px 16px 20px;
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
        }

        .bottom-nav a {
            color: #6b6b7a;
            text-decoration: none;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .bottom-nav a.active {
            color: #f5576c;
        }

        .bottom-nav span {
            font-size: 0.65rem;
        }

        /* Quick Actions */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .action-card {
            background: #12141c;
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
            color: white;
            display: block;
        }

        .action-card:active {
            transform: scale(0.96);
        }

        .action-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .action-label {
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(245, 87, 108, 0.2);
            border-top-color: #f5576c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">Ⓡⓐⓝⓚⓐ</div>
            <button class="profile-icon" onclick="window.location.href='profile.html'">👤</button>
        </div>

        <div id="dashboardContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading dashboard...</p>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="dashboard.html" class="active">📊<span>Dashboard</span></a>
            <a href="index.html">🏠<span>Feed</span></a>
            <a href="search.html">🔍<span>Search</span></a>
            <a href="leaderboard.html">🏆<span>Top</span></a>
            <a href="profile.html">👤<span>Profile</span></a>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Edit Item</div>
            <input type="text" id="editTitle" placeholder="Title / Match Name" style="display: none;">
            <textarea id="editContent" placeholder="Content"></textarea>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn save" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">Delete Item</div>
            <p style="margin-bottom: 20px;">Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="modal-btn delete-confirm" onclick="confirmDelete()">Delete Permanently</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const SUPABASE_URL = 'https://wmqsephiktkndrzasdam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcXNlcGhpa3RrbmRyemFzZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzk2NDEsImV4cCI6MjA5MjY1NTY0MX0.cpun979RKcODBePmVFij02PPcLwiSTRESrzPkiuTB5I';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let tipsterProfile = null;
        let posts = [];
        let predictions = [];
        let stories = [];
        
        let currentEditItem = null;
        let currentEditType = null;
        let currentDeleteItem = null;
        let currentDeleteType = null;
        
        async function init() {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) {
                window.location.href = 'login.html?redirect=dashboard.html';
                return;
            }
            currentUser = user;
            
            await loadTipsterProfile();
        }
        
        async function loadTipsterProfile() {
            const { data: profile, error } = await sb
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .maybeSingle();
            
            if (error) {
                console.error(error);
                showError('Error loading profile');
                return;
            }
            
            if (!profile || !profile.page_name) {
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="warning-box">
                        <div style="font-size: 3rem; margin-bottom: 12px;">⚠️</div>
                        <h3>Not a Tipster Yet</h3>
                        <p style="margin: 12px 0; color: #8e8e9a;">You need to become a tipster to access the dashboard.</p>
                        <a href="setup-profile.html" class="btn-primary" style="display: inline-block; width: auto; padding: 12px 24px; background: linear-gradient(135deg, #f093fb, #f5576c); border-radius: 30px; text-decoration: none; color: white;">Become a Tipster →</a>
                    </div>
                `;
                return;
            }
            
            tipsterProfile = profile;
            await loadAllContent();
            renderDashboard();
        }
        
        async function loadAllContent() {
            await Promise.all([
                loadPosts(),
                loadPredictions(),
                loadStories()
            ]);
        }
        
        async function loadPosts() {
            const { data, error } = await sb
                .from('posts')
                .select('*')
                .eq('tipster_id', currentUser.id)
                .order('created_at', { ascending: false });
            
            if (!error) {
                posts = data || [];
            }
        }
        
        async function loadPredictions() {
            const { data, error } = await sb
                .from('predictions')
                .select('*')
                .eq('tipster_id', currentUser.id)
                .order('created_at', { ascending: false });
            
            if (!error) {
                predictions = data || [];
            }
        }
        
        async function loadStories() {
            const { data, error } = await sb
                .from('stories')
                .select('*')
                .eq('tipster_id', currentUser.id)
                .order('created_at', { ascending: false });
            
            if (!error) {
                stories = data || [];
            }
        }
        
        function renderDashboard() {
            const container = document.getElementById('dashboardContent');
            const displayName = tipsterProfile.display_name || tipsterProfile.username;
            
            // Calculate stats
            const wins = predictions.filter(p => p.status === 'won').length;
            const losses = predictions.filter(p => p.status === 'lost').length;
            const totalPicks = predictions.length;
            const winRate = totalPicks > 0 ? Math.round((wins / totalPicks) * 100) : 0;
            
            container.innerHTML = `
                <div class="welcome-banner">
                    <div class="welcome-text">Welcome back, ${escapeHtml(displayName)}!</div>
                    <div class="welcome-sub">@${escapeHtml(tipsterProfile.page_name)} • Manage your content</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${posts.length}</div>
                        <div class="stat-label">Posts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${predictions.length}</div>
                        <div class="stat-label">Predictions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stories.filter(s => new Date(s.expires_at) > new Date()).length}</div>
                        <div class="stat-label">Active Stories</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${winRate}%</div>
                        <div class="stat-label">Win Rate</div>
                    </div>
                </div>
                
                <div class="section-title">⚡ Quick Actions</div>
                <div class="actions-grid">
                    <div class="action-card" onclick="window.location.href='create-post.html'">
                        <div class="action-icon">📝</div>
                        <div class="action-label">Create Post</div>
                    </div>
                    <div class="action-card" onclick="window.location.href='create-prediction.html'">
                        <div class="action-icon">🎯</div>
                        <div class="action-label">Add Prediction</div>
                    </div>
                    <div class="action-card" onclick="window.location.href='create-story.html'">
                        <div class="action-icon">📸</div>
                        <div class="action-label">Post Story</div>
                    </div>
                </div>
                
                <div class="section-title">
                    📝 Your Posts
                    <span style="font-size: 0.7rem;">${posts.length} total</span>
                </div>
                <div class="content-list">
                    ${renderPostsList()}
                </div>
                
                <div class="section-title">
                    🎯 Your Predictions
                    <span style="font-size: 0.7rem;">${predictions.length} total</span>
                </div>
                <div class="content-list">
                    ${renderPredictionsList()}
                </div>
                
                <div class="section-title">
                    📸 Your Stories
                    <span style="font-size: 0.7rem;">${stories.filter(s => new Date(s.expires_at) > new Date()).length} active</span>
                </div>
                <div class="content-list">
                    ${renderStoriesList()}
                </div>
            `;
        }
        
        function renderPostsList() {
            if (posts.length === 0) {
                return `<div class="empty-state">No posts yet. Create your first post!</div>`;
            }
            
            return posts.map(post => `
                <div class="content-card">
                    <div class="card-content">
                        <div class="card-header">
                            <span class="card-title">${escapeHtml(post.content.substring(0, 50))}${post.content.length > 50 ? '...' : ''}</span>
                            <span class="card-badge badge-post">Post</span>
                        </div>
                        <div class="card-preview">${escapeHtml(post.content.substring(0, 100))}${post.content.length > 100 ? '...' : ''}</div>
                        ${post.image_url ? `<img src="${post.image_url}" class="card-image" alt="Post image">` : ''}
                        <div class="card-meta">${timeAgo(post.created_at)} • ❤️ ${post.likes_count || 0} likes</div>
                        <div class="card-actions">
                            <button class="card-btn view" onclick="viewPost('${post.id}')">👁️ View</button>
                            <button class="card-btn edit" onclick="openEditModal('post', '${post.id}', '${escapeHtml(post.content).replace(/'/g, "\\'")}')">✏️ Edit</button>
                            <button class="card-btn delete" onclick="openDeleteModal('post', '${post.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderPredictionsList() {
            if (predictions.length === 0) {
                return `<div class="empty-state">No predictions yet. Add your first prediction!</div>`;
            }
            
            return predictions.map(pred => {
                let statusClass = '';
                let statusText = '';
                if (pred.status === 'won') {
                    statusClass = 'badge-post';
                    statusText = 'WON';
                } else if (pred.status === 'lost') {
                    statusClass = 'badge-story';
                    statusText = 'LOST';
                } else {
                    statusClass = 'badge-prediction';
                    statusText = 'PENDING';
                }
                
                return `
                    <div class="content-card">
                        <div class="card-content">
                            <div class="card-header">
                                <span class="card-title">${escapeHtml(pred.match_name)}</span>
                                <span class="card-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="card-preview">🎯 ${escapeHtml(pred.prediction_value || pred.prediction_type || 'Pick')}</div>
                            ${pred.odds ? `<div class="card-preview">📊 Odds: ${pred.odds}</div>` : ''}
                            <div class="card-meta">${timeAgo(pred.created_at)}</div>
                            <div class="card-actions">
                                <button class="card-btn view" onclick="viewPrediction('${pred.id}')">👁️ View</button>
                                <button class="card-btn edit" onclick="openEditModal('prediction', '${pred.id}', '${escapeHtml(pred.prediction_value || '').replace(/'/g, "\\'")}', '${escapeHtml(pred.match_name).replace(/'/g, "\\'")}')">✏️ Edit</button>
                                <button class="card-btn delete" onclick="openDeleteModal('prediction', '${pred.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderStoriesList() {
            const activeStories = stories.filter(s => new Date(s.expires_at) > new Date());
            if (activeStories.length === 0) {
                return `<div class="empty-state">No active stories. Create a story to engage followers!</div>`;
            }
            
            return activeStories.map(story => `
                <div class="content-card">
                    <div class="card-content">
                        <div class="card-header">
                            <span class="card-title">${escapeHtml(story.prediction_text || 'Story')}</span>
                            <span class="card-badge badge-story">Story</span>
                        </div>
                        <div class="card-preview">📸 Expires: ${getTimeLeft(story.expires_at)}</div>
                        ${story.caption ? `<div class="card-preview">${escapeHtml(story.caption.substring(0, 50))}${story.caption.length > 50 ? '...' : ''}</div>` : ''}
                        <div class="card-meta">👁️ ${story.views_count || 0} views</div>
                        <div class="card-actions">
                            <button class="card-btn delete" onclick="openDeleteModal('story', '${story.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function viewPost(postId) {
            window.location.href = `tipster.html?page=${tipsterProfile.page_name}`;
        }
        
        function viewPrediction(predictionId) {
            window.location.href = `prediction.html?id=${predictionId}`;
        }
        
        function openEditModal(type, id, content, title = null) {
            currentEditType = type;
            currentEditItem = { id, content, title };
            
            const modal = document.getElementById('editModal');
            const modalTitle = document.getElementById('modalTitle');
            const editTitleInput = document.getElementById('editTitle');
            const editContentArea = document.getElementById('editContent');
            
            if (type === 'prediction') {
                modalTitle.textContent = 'Edit Prediction';
                editTitleInput.style.display = 'block';
                editTitleInput.placeholder = 'Match Name';
                editTitleInput.value = title || '';
                editContentArea.placeholder = 'Prediction Value';
                editContentArea.value = content;
            } else {
                modalTitle.textContent = 'Edit Post';
                editTitleInput.style.display = 'none';
                editContentArea.placeholder = 'Post Content';
                editContentArea.value = content;
            }
            
            modal.style.display = 'flex';
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditItem = null;
            currentEditType = null;
        }
        
        async function saveEdit() {
            if (!currentEditItem) return;
            
            const newContent = document.getElementById('editContent').value.trim();
            
            if (!newContent) {
                showToast('Content cannot be empty');
                return;
            }
            
            let updateData = {};
            
            if (currentEditType === 'post') {
                updateData = { content: newContent, updated_at: new Date().toISOString() };
                const { error } = await sb
                    .from('posts')
                    .update(updateData)
                    .eq('id', currentEditItem.id)
                    .eq('tipster_id', currentUser.id);
                
                if (error) {
                    showToast('Error updating post: ' + error.message);
                    return;
                }
                
                // Update local array
                const post = posts.find(p => p.id === currentEditItem.id);
                if (post) post.content = newContent;
                
            } else if (currentEditType === 'prediction') {
                const newTitle = document.getElementById('editTitle').value.trim();
                updateData = { prediction_value: newContent, updated_at: new Date().toISOString() };
                if (newTitle) updateData.match_name = newTitle;
                
                const { error } = await sb
                    .from('predictions')
                    .update(updateData)
                    .eq('id', currentEditItem.id)
                    .eq('tipster_id', currentUser.id);
                
                if (error) {
                    showToast('Error updating prediction: ' + error.message);
                    return;
                }
                
                // Update local array
                const pred = predictions.find(p => p.id === currentEditItem.id);
                if (pred) {
                    pred.prediction_value = newContent;
                    if (newTitle) pred.match_name = newTitle;
                }
            }
            
            showToast('Updated successfully!');
            closeEditModal();
            renderDashboard();
        }
        
        function openDeleteModal(type, id) {
            currentDeleteType = type;
            currentDeleteItem = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            currentDeleteItem = null;
            currentDeleteType = null;
        }
        
        async function confirmDelete() {
            if (!currentDeleteItem) return;
            
            let error = null;
            
            if (currentDeleteType === 'post') {
                const { error: deleteError } = await sb
                    .from('posts')
                    .delete()
                    .eq('id', currentDeleteItem)
                    .eq('tipster_id', currentUser.id);
                error = deleteError;
                
                // Remove from local array
                posts = posts.filter(p => p.id !== currentDeleteItem);
                
            } else if (currentDeleteType === 'prediction') {
                const { error: deleteError } = await sb
                    .from('predictions')
                    .delete()
                    .eq('id', currentDeleteItem)
                    .eq('tipster_id', currentUser.id);
                error = deleteError;
                
                // Remove from local array
                predictions = predictions.filter(p => p.id !== currentDeleteItem);
                
            } else if (currentDeleteType === 'story') {
                const { error: deleteError } = await sb
                    .from('stories')
                    .delete()
                    .eq('id', currentDeleteItem)
                    .eq('tipster_id', currentUser.id);
                error = deleteError;
                
                // Remove from local array
                stories = stories.filter(s => s.id !== currentDeleteItem);
            }
            
            if (error) {
                showToast('Error deleting: ' + error.message);
            } else {
                showToast('Deleted successfully!');
            }
            
            closeDeleteModal();
            renderDashboard();
        }
        
        function getTimeLeft(expiresAt) {
            const diff = new Date(expiresAt) - new Date();
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }
        
        function timeAgo(date) {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showError(message) {
            document.getElementById('dashboardContent').innerHTML = `
                <div class="empty-state" style="margin: 20px;">
                    <div style="font-size: 3rem;">⚠️</div>
                    <h3>Error</h3>
                    <p>${escapeHtml(message)}</p>
                    <a href="index.html" style="color: #f5576c; text-decoration: none;">Back to Home</a>
                </div>
            `;
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        init();
    </script>
</body>
