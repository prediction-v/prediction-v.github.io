<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Send Feedback • Ranka</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0c10;
            color: #fff;
            line-height: 1.5;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            position: sticky;
            top: 0;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            flex: 1;
        }

        .section {
            background: #12141c;
            margin: 16px;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #8e8e9a;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            background: #1a1c26;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #f5576c;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            padding: 14px;
            border-radius: 28px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin: 16px;
            text-align: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 8px 16px 20px;
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
        }

        .bottom-nav a {
            color: #6b6b7a;
            text-decoration: none;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .bottom-nav a.active {
            color: #f5576c;
        }

        .bottom-nav span {
            font-size: 0.65rem;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <button class="back-btn" onclick="history.back()">←</button>
            <div class="logo">Send Feedback</div>
            <div style="width: 32px;"></div>
        </div>

        <div id="mainContent">
            <div class="section">
                <div class="form-group">
                    <label>Your Email (optional - so we can reply)</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Feedback Type</label>
                    <select id="type">
                        <option value="suggestion">💡 Suggestion</option>
                        <option value="bug">🐛 Bug Report</option>
                        <option value="feature">✨ Feature Request</option>
                        <option value="general">💬 General Feedback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Message <span class="required" style="color:#f5576c;">*</span></label>
                    <textarea id="message" placeholder="Tell us what you think..."></textarea>
                </div>
                <button class="btn-primary" id="submitBtn" onclick="sendFeedback()">Send Feedback →</button>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html">🏠<span>Feed</span></a>
            <a href="search.html">🔍<span>Search</span></a>
            <a href="feedback.html" class="active">💬<span>Feedback</span></a>
            <a href="leaderboard.html">🏆<span>Top</span></a>
            <a href="profile.html">👤<span>Profile</span></a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const SUPABASE_URL = 'https://wmqsephiktkndrzasdam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcXNlcGhpa3RrbmRyemFzZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzk2NDEsImV4cCI6MjA5MjY1NTY0MX0.cpun979RKcODBePmVFij02PPcLwiSTRESrzPkiuTB5I';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        
        async function init() {
            const { data: { user } } = await sb.auth.getUser();
            currentUser = user;
            
            // Pre-fill email if user is logged in
            if (currentUser && currentUser.email) {
                document.getElementById('email').value = currentUser.email;
            }
        }
        
        async function sendFeedback() {
            const email = document.getElementById('email').value.trim();
            const type = document.getElementById('type').value;
            const message = document.getElementById('message').value.trim();
            
            if (!message) {
                showToast('Please enter your feedback');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-sm"></span>Sending...';
            
            // Insert feedback into database
            const { data, error } = await sb
                .from('feedback')
                .insert({
                    user_id: currentUser?.id || null,
                    email: email || null,
                    type: type,
                    message: message,
                    status: 'pending',
                    created_at: new Date().toISOString()
                })
                .select();
            
            if (error) {
                console.error('Error saving feedback:', error);
                showToast('Error sending feedback: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Send Feedback →';
                return;
            }
            
            // Show success message
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="success-box">
                    <div style="font-size: 3rem; margin-bottom: 12px;">✅</div>
                    <h3>Thank you for your feedback!</h3>
                    <p style="margin-top: 8px; color: #8e8e9a;">We appreciate you helping us improve Ranka.</p>
                    <a href="index.html" class="btn-primary" style="display: inline-block; width: auto; margin-top: 16px; text-decoration: none;">Back to Feed →</a>
                </div>
            `;
            
            showToast('Feedback sent! Thank you 🙏');
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        init();
    </script>
</body>
</html>
