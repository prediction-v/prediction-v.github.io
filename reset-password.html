<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Reset Password • Ranka</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0c10;
            color: #fff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            margin: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 30% 30%, #fbb8d4, #ec4899);
            border-radius: 50%;
            position: relative;
            margin: 0 auto 12px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
            border: 2px solid rgba(255,255,255,0.15);
        }

        .logo-icon::after {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            background: #0a0c10;
            border-radius: 50%;
            top: 8px;
            right: 8px;
            box-shadow: inset -2px 2px 6px rgba(0,0,0,0.5);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbb8d4, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card {
            background: #12141c;
            border-radius: 28px;
            padding: 32px 28px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fbb8d4, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card p {
            color: #8e8e9a;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #8e8e9a;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            background: #1a1c26;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #f5576c;
            background: #1f212e;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            padding: 14px;
            border-radius: 28px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 8px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #8e8e9a;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .back-link a:hover {
            color: #f5576c;
        }

        .password-hint {
            font-size: 0.65rem;
            color: #6b6b7a;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">Ranka</div>
        </div>

        <div class="card">
            <h2>Reset password</h2>
            <p>Create a new password for your account</p>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
                <div class="password-hint">Must be at least 6 characters</div>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="off">
            </div>

            <button id="resetPasswordBtn" class="btn-primary">Update password →</button>

            <div id="message" class="message"></div>

            <div class="back-link">
                <a href="login.html">← Back to login</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wmqsephiktkndrzasdam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcXNlcGhpa3RrbmRyemFzZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzk2NDEsImV4cCI6MjA5MjY1NTY0MX0.cpun979RKcODBePmVFij02PPcLwiSTRESrzPkiuTB5I';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function updatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetPasswordBtn');
            const messageDiv = document.getElementById('message');

            // Clear previous message
            messageDiv.className = 'message';
            messageDiv.textContent = '';

            // Validation
            if (!newPassword || !confirmPassword) {
                showMessage('Please fill in both fields', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            // Set loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-sm"></span>Updating...';

            try {
                // Update the user's password using the session from the reset link
                const { data, error } = await sb.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    if (error.message.includes('session')) {
                        showMessage('Your reset link may have expired. Please request a new one.', 'error');
                    } else {
                        showMessage(error.message, 'error');
                    }
                    return;
                }

                if (data.user) {
                    showMessage('Password updated successfully! Redirecting to login...', 'success');
                    
                    // Sign out to ensure fresh state, then redirect
                    await sb.auth.signOut();
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } catch (err) {
                showMessage('Something went wrong. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Update password →';
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        // Handle Enter key
        function setupEnterKey() {
            const inputs = ['newPassword', 'confirmPassword'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') updatePassword();
                });
            });
        }

        // Check if user came from valid reset link (has session)
        async function checkResetSession() {
            const { data: { session } } = await sb.auth.getSession();
            
            if (!session) {
                // No active session — user might have clicked expired link or isn't authenticated
                const messageDiv = document.getElementById('message');
                messageDiv.textContent = 'No valid reset session found. Please request a new password reset link.';
                messageDiv.className = 'message error';
                
                // Disable the reset button
                document.getElementById('resetPasswordBtn').disabled = true;
                document.getElementById('resetPasswordBtn').style.opacity = '0.5';
            }
        }

        // Attach event listener
        document.getElementById('resetPasswordBtn').addEventListener('click', updatePassword);
        setupEnterKey();
        checkResetSession();
    </script>
</body>
</html>
