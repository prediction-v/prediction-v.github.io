<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Story • Ranka</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Story Container */
        .story-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* Progress Bar */
        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
        }

        .progress-segment {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width linear;
        }

        .progress-segment.active .progress-fill {
            background: #f5576c;
        }

        /* Story Content */
        .story-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .story-image.cover {
            object-fit: cover;
        }

        /* Story Overlay */
        .story-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 16px 40px;
            z-index: 10;
        }

        /* Tipster Info */
        .tipster-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tipster-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .tipster-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tipster-avatar span {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .tipster-details {
            flex: 1;
        }

        .tipster-name {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .verified-badge {
            background: #1e9eff;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .story-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
        }

        /* Prediction Card */
        .prediction-card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .prediction-label {
            font-size: 0.7rem;
            color: #f5576c;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .prediction-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .odds-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .odds-chip {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .odds-chip strong {
            color: #10b981;
        }

        /* Caption */
        .story-caption {
            margin-top: 12px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: rgba(255,255,255,0.9);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 16px;
        }

        .action-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            flex: 1;
            justify-content: center;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .action-btn.whatsapp {
            background: #25d366;
        }

        .action-btn.telegram {
            background: #0088cc;
        }

        /* Touch Areas */
        .touch-areas {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            z-index: 15;
        }

        .touch-left {
            width: 30%;
            height: 100%;
            cursor: pointer;
        }

        .touch-right {
            width: 70%;
            height: 100%;
            cursor: pointer;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(245, 87, 108, 0.2);
            border-top-color: #f5576c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* No Stories */
        .error-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px;
        }

        .error-container .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .error-container a {
            color: #f5576c;
            text-decoration: none;
            margin-top: 16px;
            display: inline-block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.8rem;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="story-container" id="storyContainer">
        <div class="progress-bar-container" id="progressBar"></div>
        <div class="touch-areas">
            <div class="touch-left" id="touchLeft"></div>
            <div class="touch-right" id="touchRight"></div>
        </div>
        <button class="close-btn" onclick="closeStory()">✕</button>
        <div id="storyContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading story...</p>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const SUPABASE_URL = 'https://wmqsephiktkndrzasdam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcXNlcGhpa3RrbmRyemFzZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzk2NDEsImV4cCI6MjA5MjY1NTY0MX0.cpun979RKcODBePmVFij02PPcLwiSTRESrzPkiuTB5I';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentStories = [];
        let currentIndex = 0;
        let currentUser = null;
        let tipsterProfile = null;
        let progressInterval = null;
        let isPaused = false;
        let storyDuration = 10000; // 10 seconds per story
        
        async function init() {
            const { data: { user } } = await sb.auth.getUser();
            currentUser = user;
            
            // Get tipster info from URL
            const urlParams = new URLSearchParams(window.location.search);
            const tipsterPage = urlParams.get('tipster');
            
            // Try to get stories from localStorage first (from feed click)
            let storedStories = localStorage.getItem('viewingStories');
            let tipsterId = null;
            
            if (storedStories) {
                currentStories = JSON.parse(storedStories);
                localStorage.removeItem('viewingStories');
                localStorage.removeItem('currentStoryIndex');
            }
            
            // If no stored stories, fetch from Supabase
            if (currentStories.length === 0 && tipsterPage) {
                await loadStoriesFromSupabase(tipsterPage);
            } else if (currentStories.length === 0) {
                showError('No stories available');
                return;
            }
            
            // Load tipster profile for contact info
            if (currentStories.length > 0 && currentStories[0].tipster) {
                tipsterProfile = currentStories[0].tipster;
            } else if (tipsterPage) {
                await loadTipsterProfile(tipsterPage);
            }
            
            // Increment view count for all these stories
            await incrementViewCounts();
            
            renderStory(currentIndex);
            setupTouchEvents();
        }
        
        async function loadStoriesFromSupabase(tipsterPage) {
            // Get tipster profile first
            const { data: profile } = await sb
                .from('profiles')
                .select('*')
                .eq('page_name', tipsterPage)
                .single();
            
            if (!profile) {
                showError('Tipster not found');
                return;
            }
            
            tipsterProfile = profile;
            
            // Get active stories for this tipster
            const { data: stories } = await sb
                .from('stories')
                .select('*')
                .eq('tipster_id', profile.id)
                .gte('expires_at', new Date().toISOString())
                .order('created_at', { ascending: true });
            
            if (!stories || stories.length === 0) {
                showError('No active stories from this tipster');
                return;
            }
            
            currentStories = stories.map(story => ({
                ...story,
                tipster: profile
            }));
        }
        
        async function loadTipsterProfile(pageName) {
            const { data: profile } = await sb
                .from('profiles')
                .select('*')
                .eq('page_name', pageName)
                .single();
            
            if (profile) {
                tipsterProfile = profile;
            }
        }
        
        async function incrementViewCounts() {
            for (const story of currentStories) {
                await sb
                    .from('stories')
                    .update({ views_count: (story.views_count || 0) + 1 })
                    .eq('id', story.id);
            }
        }
        
        function renderStory(index) {
            if (index < 0 || index >= currentStories.length) {
                closeStory();
                return;
            }
            
            const story = currentStories[index];
            const container = document.getElementById('storyContent');
            const tipster = story.tipster || tipsterProfile;
            
            const displayName = tipster?.display_name || tipster?.username || 'Tipster';
            const avatarLetter = displayName.charAt(0).toUpperCase();
            const isVerified = tipster?.verification_status === 'verified';
            const timeLeft = getTimeLeft(story.expires_at);
            
            container.innerHTML = `
                <div class="story-content">
                    <img src="${story.image_url}" class="story-image cover" alt="Story" onerror="this.src='https://placehold.co/600x800/1a1c26/white?text=📸'">
                    <div class="story-overlay">
                        <div class="tipster-info" onclick="window.location.href='tipster.html?page=${tipster?.page_name}'">
                            <div class="tipster-avatar">
                                ${tipster?.avatar_url ? `<img src="${tipster.avatar_url}" alt="">` : `<span>${avatarLetter}</span>`}
                            </div>
                            <div class="tipster-details">
                                <div class="tipster-name">
                                    ${escapeHtml(displayName)}
                                    ${isVerified ? '<span class="verified-badge">✓ Verified</span>' : ''}
                                </div>
                                <div class="story-time">⏳ ${timeLeft} left • 👁️ ${(story.views_count || 0) + 1} views</div>
                            </div>
                        </div>
                        
                        <div class="prediction-card">
                            <div class="prediction-label">🎯 PREDICTION</div>
                            <div class="prediction-text">${escapeHtml(story.prediction_text || 'Check the prediction!')}</div>
                            ${story.odds ? `
                                <div class="odds-row">
                                    <div class="odds-chip">Odds: <strong>${story.odds}</strong></div>
                                </div>
                            ` : ''}
                            ${story.caption ? `<div class="story-caption">${escapeHtml(story.caption)}</div>` : ''}
                        </div>
                        
                        <div class="action-buttons">
                            <button class="action-btn" onclick="copyPrediction()">📋 Copy</button>
                            <button class="action-btn primary" onclick="window.location.href='tipster.html?page=${tipster?.page_name}'">👤 View Profile</button>
                        </div>
                        
                        ${tipster?.whatsapp_number && tipster.show_whatsapp !== false ? `
                            <div class="action-buttons" style="margin-top: 8px;">
                                <button class="action-btn whatsapp" onclick="contactWhatsApp('${tipster.whatsapp_number}')">💬 WhatsApp</button>
                                ${tipster?.telegram_username && tipster.show_telegram !== false ? `
                                    <button class="action-btn telegram" onclick="contactTelegram('${tipster.telegram_username}')">✈️ Telegram</button>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // Update progress bar
            updateProgressBar(index);
            startProgressTimer();
        }
        
        function updateProgressBar(currentIndex) {
            const container = document.getElementById('progressBar');
            const total = currentStories.length;
            
            let html = '';
            for (let i = 0; i < total; i++) {
                const isActive = i === currentIndex;
                const isCompleted = i < currentIndex;
                html += `
                    <div class="progress-segment ${isActive ? 'active' : ''}">
                        <div class="progress-fill" style="${isCompleted ? 'width: 100%;' : (isActive ? 'width: 0%;' : 'width: 0%;')}"></div>
                    </div>
                `;
            }
            container.innerHTML = html;
            
            if (isActive) {
                const fill = container.querySelector('.active .progress-fill');
                if (fill) {
                    fill.style.transition = `width ${storyDuration}ms linear`;
                    setTimeout(() => {
                        if (fill) fill.style.width = '100%';
                    }, 10);
                }
            }
        }
        
        function startProgressTimer() {
            if (progressInterval) clearInterval(progressInterval);
            
            let startTime = Date.now();
            let elapsed = 0;
            
            progressInterval = setInterval(() => {
                if (isPaused) return;
                
                elapsed = Date.now() - startTime;
                if (elapsed >= storyDuration) {
                    nextStory();
                }
            }, 100);
        }
        
        function nextStory() {
            if (progressInterval) clearInterval(progressInterval);
            
            if (currentIndex + 1 < currentStories.length) {
                currentIndex++;
                renderStory(currentIndex);
            } else {
                closeStory();
            }
        }
        
        function prevStory() {
            if (progressInterval) clearInterval(progressInterval);
            
            if (currentIndex - 1 >= 0) {
                currentIndex--;
                renderStory(currentIndex);
            }
        }
        
        function setupTouchEvents() {
            const leftArea = document.getElementById('touchLeft');
            const rightArea = document.getElementById('touchRight');
            
            let touchStartX = 0;
            let touchEndX = 0;
            
            leftArea.addEventListener('click', (e) => {
                e.stopPropagation();
                prevStory();
            });
            
            rightArea.addEventListener('click', (e) => {
                e.stopPropagation();
                nextStory();
            });
            
            // Pause on touch start, resume on touch end
            const storyContent = document.getElementById('storyContent');
            storyContent.addEventListener('touchstart', () => {
                isPaused = true;
                if (progressInterval) clearInterval(progressInterval);
            });
            
            storyContent.addEventListener('touchend', () => {
                isPaused = false;
                startProgressTimer();
            });
            
            // Also handle mouse for desktop
            storyContent.addEventListener('mousedown', () => {
                isPaused = true;
                if (progressInterval) clearInterval(progressInterval);
            });
            
            storyContent.addEventListener('mouseup', () => {
                isPaused = false;
                startProgressTimer();
            });
        }
        
        function copyPrediction() {
            const story = currentStories[currentIndex];
            const text = `${story.prediction_text || 'Prediction'} | Odds: ${story.odds || 'N/A'} | Via Ranka`;
            navigator.clipboard.writeText(text);
            showToast('Copied to clipboard!');
        }
        
        function contactWhatsApp(number) {
            // Format number (remove any non-digit characters)
            const cleanNumber = number.replace(/\D/g, '');
            const url = `https://wa.me/${cleanNumber}`;
            window.open(url, '_blank');
        }
        
        function contactTelegram(username) {
            const cleanUsername = username.replace('@', '');
            const url = `https://t.me/${cleanUsername}`;
            window.open(url, '_blank');
        }
        
        function getTimeLeft(expiresAt) {
            const diff = new Date(expiresAt) - new Date();
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }
        
        function closeStory() {
            if (progressInterval) clearInterval(progressInterval);
            window.location.href = 'index.html';
        }
        
        function showError(message) {
            const container = document.getElementById('storyContent');
            container.innerHTML = `
                <div class="error-container">
                    <div class="icon">📭</div>
                    <h3>${escapeHtml(message)}</h3>
                    <a href="index.html">← Back to Feed</a>
                </div>
            `;
            document.querySelector('.progress-bar-container').style.display = 'none';
            document.querySelector('.close-btn').style.display = 'block';
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        init();
    </script>
</body>
</html>
